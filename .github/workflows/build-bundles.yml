name: build-offline-bundles

# 多发行版离线安装包:在目标发行版容器内源码编译 llama.cpp(产物天然匹配该发行版
# glibc,规避预编译包门槛漂移),按发行版 × 模型组装完整离线包,并在同容器内跑
# install.sh 冒烟(容器无 systemd,顺带覆盖 nohup 兜底路径)。
# 产物:workflow artifact(bundle-<distro>-<model>);push v* tag 时自动挂 GitHub Release。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: bundles-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_TAG: b10901          # llama.cpp 源码编译的钉版 tag,升级时改这里
  NODE_VER: '22.20.0'        # ≥22.19(pi 的硬要求);rocky8(glibc 2.28)是官方 Node 22 下限
  PI_VER: '0.85.1'          # 与已验证的 v26.3.9 保持一致，禁止打包时随 latest 漂移
jobs:
  test:
    name: packaging regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验打包及损坏包回归测试
        run: |
          for script in install.sh env-check.sh fetch-bundle.sh scripts/*.sh; do bash -n "$script"; done
          bash -n assets/bin/pi-ops-verify
          python3 tests/test-packaging.py
          python3 tests/test-verify-package.py

  build:
    needs: test
    name: bundle / ${{ matrix.target.slug }} / ${{ matrix.model.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          # 麒麟 V10 Lance 档:麒麟无公开容器镜像,用同为 RHEL8 血统、glibc 2.28 的
          # rockylinux:8 做构建基座;产物命名 kylin-v10,兼容麒麟 V10 / RHEL8 系
          - { slug: kylin-v10, image: 'rockylinux:8' }
          # 需要 Ubuntu 包时恢复此行(基座按需换 ubuntu:20.04 兼容更老版本):
          # - { slug: ubuntu-22.04, image: 'ubuntu:22.04' }
        model:
          - id: qwen3.5-2b
            gguf_url: https://huggingface.co/bartowski/Qwen_Qwen3.5-2B-GGUF/resolve/main/Qwen_Qwen3.5-2B-Q4_K_M.gguf
            cache_key: gguf-qwen3.5-2b-Q4_K_M
          - id: qwen3.5-0.8b
            gguf_url: https://huggingface.co/bartowski/Qwen_Qwen3.5-0.8B-GGUF/resolve/main/Qwen_Qwen3.5-0.8B-Q4_K_M.gguf
            cache_key: gguf-qwen3.5-0.8b-Q4_K_M
    container:
      image: ${{ matrix.target.image }}
    steps:
      - name: 容器预装 git/证书(actions/checkout 需要)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq git ca-certificates curl xz-utils >/dev/null
          else
            dnf install -y -q git ca-certificates curl xz tar findutils
          fi
      - uses: actions/checkout@v4

      - name: 缓存模型 GGUF(按模型 ID 与量化钉 key)
        uses: actions/cache@v4
        with:
          path: .ci-gguf-cache/${{ matrix.model.id }}.gguf
          key: ${{ matrix.model.cache_key }}

      - name: 构建离线包
        run: scripts/ci-build.sh
        env:
          DISTRO_SLUG: ${{ matrix.target.slug }}
          BUNDLE_MODEL_ID: ${{ matrix.model.id }}
          GGUF_URL: ${{ matrix.model.gguf_url }}
          GGUF_CACHE: ${{ github.workspace }}/.ci-gguf-cache/${{ matrix.model.id }}.gguf
          PI_OPS_VERSION: ${{ github.ref_name == 'main' && format('dev-{0}', github.sha) || github.ref_name }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target.slug }}-${{ matrix.model.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: 保存完整编译诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target.slug }}-${{ matrix.model.id }}
          path: .ci-work/llama-build.log
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: clean install / ${{ matrix.target.slug }} / ${{ matrix.model }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { slug: kylin-v10, image: 'rockylinux:8' }
          # 启用 Ubuntu 构建时，此处同时启用相同运行时目标。
          # - { slug: ubuntu-22.04, image: 'ubuntu:22.04' }
        model: [qwen3.5-2b, qwen3.5-0.8b]
    container:
      image: ${{ matrix.target.image }}
    steps:
      - name: 仅安装运行时基件及验收工具
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq git ca-certificates curl xz-utils gzip procps python3 passwd util-linux
          else
            dnf install -y -q git ca-certificates curl bash tar gzip xz findutils gawk grep sed procps-ng python3 shadow-utils util-linux
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.target.slug }}-${{ matrix.model }}
          path: downloaded
      - name: 检查真实产物并用普通用户离线安装
        run: bash scripts/ci-verify.sh downloaded '${{ matrix.model }}'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release/上传资产需要写权限(默认 GITHUB_TOKEN 只读,403)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'bundle-*'
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
      - name: 重新下载发布文件验证字节及包结构
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir published
          (cd published && sha256sum -c *.sha256)
          for model in qwen3.5-2b qwen3.5-0.8b; do
            for extension in run tar.gz; do
              python3 scripts/verify-package.py --model "$model" published/pi-ops-agent-"$GITHUB_REF_NAME"-kylin-v10-"$model"-x64."$extension"
            done
          done
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
